name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    # Ubuntu, not macOS: the Android SDK is preinstalled here and these minutes
    # are free on public repos, where macOS runners bill at 10x.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image ships the Android SDK. android-actions/setup-android
      # only reinstalled it, and from 22 Sept 2026 it started failing on every
      # run (GitHub moved actions onto Node 24), so use the preinstalled one.
      - name: Use the runner's Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          ls "$SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      # Android's debug keystore is generated per machine, so a fresh runner
      # would sign every build with a different key — and Android refuses an
      # update whose signature changed, forcing an uninstall (and wiping your
      # nights) on every single install. Caching one keystore under a fixed key
      # keeps the signature stable, so builds update over each other.
      - name: Restore the debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lastcall-debug-keystore-v1

      - name: Create the debug signing key if the cache was empty
        run: |
          if [ ! -f ~/.android/debug.keystore ]; then
            mkdir -p ~/.android
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated a fresh debug keystore; it will be cached for future builds."
          else
            echo "Reused the cached debug keystore."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web assets and sync
        run: npm run sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the artifact after the commit
        id: name
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: lastcall-debug-${{ steps.name.outputs.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
