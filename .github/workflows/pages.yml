name: Deploy web preview to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Serve the same www/ the Android app bundles, so the web preview can
      # never drift from what ships on the phone. No npm install needed — the
      # build falls back to the committed vendor/capacitor-core.js.
      - run: node scripts/build.mjs
      # The venue squares live on their own branch (built weekly by
      # venues.yml) and are added to the site here, not to www/ in the repo,
      # so they never end up inside the APK.
      - name: Add the venue squares
        run: |
          if git clone -q --depth 1 --branch venues-data "https://github.com/${{ github.repository }}.git" venues-src; then
            rm -rf venues-src/.git
            mkdir -p www/venues
            cp -R venues-src/. www/venues/
          else
            echo "No venues-data branch yet; publishing without venue squares."
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4
