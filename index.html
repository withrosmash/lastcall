<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Leit</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./vendor/leaflet.css">
<link rel="stylesheet" href="./css/style.css">
<script>
  // Before first paint, so a light-theme user never sees a black flash.
  try {
    if (JSON.parse(localStorage.getItem('lastcall_v1') || '{}').prefs?.theme === 'light') {
      document.documentElement.dataset.theme = 'light';
      document.querySelector('meta[name="theme-color"]').content = '#EEF2F8';
      document.querySelector('meta[name="color-scheme"]').content = 'light';
    }
  } catch (e) { /* unreadable storage: stay dark */ }
</script>
</head>
<body>
<div class="bloom" id="bloom" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<div class="frame">
  <div id="chrome"></div>
  <main id="app" aria-live="polite"></main>
</div>
<div id="sheet-root"></div>
<script src="./vendor/leaflet.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
